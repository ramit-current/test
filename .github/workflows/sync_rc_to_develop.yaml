name: Sync RC to Develop

on:
  push:
    branches:
      - rc

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge RC into Develop
        run: |
          # Ensure we have the latest version of both branches
          git checkout develop
          git pull origin develop
          
          # Attempt to merge rc into develop
          if git merge origin/rc --no-ff -m "Autosync: Merge RC into Develop"; then
            echo "Merge successful. Pushing to develop."
            git push origin develop
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "Merge conflict detected. Creating PR branch."
            git merge --abort
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Handle Conflicts via PR
        if: steps.merge.outputs.merged == 'false'
        run: |
          SYNC_BRANCH="merge-rc-into-develop"
          
          # Create a new branch from develop
          git checkout -b "$SYNC_BRANCH"
          
          # Force the merge even with conflicts to show them in the PR
          git merge origin/rc --no-ff -m "Autosync: Merge RC into Develop" || true
          
          # Create PR
          ./scripts/pr.sh -ls # Create without squashing or running lint check
